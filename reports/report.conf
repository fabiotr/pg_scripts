# Unified per-service config for reports/generate_reports.sh (-c/--config
# or REPORT_CONFIG_FILE). One "service label dbname stmt_timeout
# total_timeout [kind]" entry per line, whitespace separated. Lines
# starting with # and blank lines are ignored.
#
# - label: replaces the raw pg_service.conf service name in the output
#   filename (<out-dir>/<date>/<date>_<label>_<kind>.md). A service with
#   no entry here, or "-" in this column, just uses its own service name.
# - dbname: highest-priority pick for which database the "database" kind
#   report connects to for that service (below it: -n/--default-dbname,
#   then auto-detect — busiest database by pg_stat_statements load if
#   installed, else the largest by size; see generate_reports.sh's own
#   header for the full order). Has no effect on "cluster" kind reports.
# - stmt_timeout/total_timeout: override -t/--stmt-timeout and
#   -T/--total-timeout for that service (e.g. a large archive database
#   that needs more time). stmt_timeout is a PostgreSQL duration (e.g.
#   300s, 20min); total_timeout is a plain number of seconds — the
#   wall-clock `timeout` wrapped around the whole psql run.
# - kind: optional, "cluster" or "database"; defaults to "*" (both kinds).
#   Give the same service two lines with different kinds if cluster and
#   database need different timeouts.
#
# Use "-" to skip a column while still setting a later one on the same
# line (e.g. "svc - mydb" sets dbname but keeps the default label).
#
# This file also doubles as the service list when generate_reports.sh is
# run with no service on the command line (services are used in the order
# they first appear here).
#
# This file is optional: generate_reports.sh looks for it at
# $HOME/pg_scripts/reports/report.conf by default and silently skips
# loading if it isn't there. Copy/rename this example to that path (or
# point -c/--config at your own file) to customize it; everything below is
# illustrative, not a live default.

# service             label            dbname        stmt_timeout  total_timeout  kind
prod_primary          prod-primary     app_prod      -             -              -
prod_replica_1        prod-replica-01  -             -             -              -
staging               staging          app_staging   -             -              -
big_archive_db        -                -             1200s         3000           -
staging_replica       -                -             600s          1200           database

